name: 'npm-publish'
description: 'npm-publish is a github composite action publish npm package.'
inputs:
  github-token:
    description: 'Github Token'
    required: true
    default: ''
  version:
    description: 'Version to be published'
    required: true
    default: ''
  path:
    description: 'Path to the package'
    required: true
    default: ''
  tag:
    description: 'npm dist-tag to publish under (e.g. latest, rc)'
    required: false
    default: 'latest'
runs:
  using: "composite"
  steps:
    - name: Node
      uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Print version
      shell: bash
      run: echo "New version ${{ inputs.version }}" && npm --version
    - name: Publish
      shell: bash
      run: npm publish ${{ inputs.path }} --tag ${{ inputs.tag }} --access public
