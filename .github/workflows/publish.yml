name: Deploy

on:
  push:
    branches:
      - master
      - feature-*
      - release-*
      - hotfix-*

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v7
      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Install
        run: yarn install
      - name: Lint
        run: yarn lint
      - name: Build
        run: yarn build

  publish:
    needs: [build]
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/hotfix-') || startsWith(github.ref, 'refs/heads/release-')
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Clone
        uses: actions/checkout@v7
      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run should-release
        shell: bash
        run: scripts/should-release.sh package.json
      - name: Check Skip Release
        id: skip
        run: echo "skip=$(cat .skip-release)" >> $GITHUB_OUTPUT
      - name: Update package.json with RC version
        if: steps.skip.outputs.skip != 'true' && github.ref != 'refs/heads/master'
        run: scripts/rc.sh package.json
      - name: Current Version
        if: steps.skip.outputs.skip != 'true'
        id: current-version
        run: echo "version=$(node -p -e "require('./package.json').version")" >> $GITHUB_OUTPUT
      - name: Resolve npm dist-tag
        if: steps.skip.outputs.skip != 'true'
        id: npm-tag
        shell: bash
        run: |
          case "${GITHUB_REF}" in
            refs/heads/master) echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
            refs/heads/release-*|refs/heads/hotfix-*) echo "tag=rc" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected ref for publish: ${GITHUB_REF}"; exit 1 ;;
          esac
      - name: Publish
        if: steps.skip.outputs.skip != 'true'
        uses: ./.github/actions/npm-publish
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ steps.current-version.outputs.version }}
          path: .
          tag: ${{ steps.npm-tag.outputs.tag }}

  create-tag:
    needs: [publish]
    if: github.ref == 'refs/heads/master'
    name: Create Tag
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Semver
        id: semver
        uses: luanlmd/semver-composite-action@v1.3.0
        with:
          repo-path: ${{ github.workspace }}
      - name: Create tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag ${{ steps.semver.outputs.version }}
          git push --tags

  notify:
    needs: [build, publish, create-tag]
    if: always()
    name: Notify
    runs-on: ubuntu-latest
    steps:
      - name: Discord Message on Success
        if: ${{ needs.build.result != 'failure' && needs.publish.result != 'failure' && needs.create-tag.result != 'failure'}}
        uses: vitorvmrs/discord-send-embed@v1
        with:
          webhook-url: ${{ secrets.PI_DISCORD_WEBHOOK }}
          title: "${{ github.repository }}/${{ github.ref_name }}"
          url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          description: "🫡 DEPLOYED / Linterzinhiúu =]"
          color: 65280
          footer-text: "${{ github.sha }} - ${{ github.event.head_commit.message }}"
      - name: Discord Message on Failure
        if: ${{ needs.build.result == 'failure' || needs.publish.result == 'failure' || needs.create-tag.result == 'failure' }}
        uses: vitorvmrs/discord-send-embed@v1
        with:
          webhook-url: ${{ secrets.PI_DISCORD_WEBHOOK }}
          title: "${{ github.repository }}/${{ github.ref_name }}"
          url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          description: "❌ FAILED / Deu ruim =["
          color: 16711680
          footer-text: "${{ github.sha }} - ${{ github.event.head_commit.message }}"
